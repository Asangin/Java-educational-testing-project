apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    type: jaeger
    uid: jaeger-uid
    editable: true
    access: proxy
    url: http://jaeger:16686
    isDefault: false